<!DOCTYPE html>
<html lang="HU">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vegyjelek</title>
    <style>
        caption{
            font-size: larger;
            font-weight: bold;
        }
        td, th{
            padding: 0.3em;
        }
        table, td, th{
            border: 1px solid;
            border-collapse: collapse;
        }
        tbody tr:last-child{
            background-color: lightblue;
        }
    </style>
</head>
<body>
    <table>
        <caption>Vegyjelek</caption>
        <thead>
            <tr>
                <th>Megnevezés</th>
                <th>Kémiai képlet</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>salétromsav</td>
                <td>HNO<sub>3</sub></td>
            </tr>
            <tr>
                <td>kénessav</td>
                <td>H<sub>2</sub>SO<sub>3</sub></td>
            </tr>
            <tr>
                <td>kénsav</td>
                <td>H<sub>2</sub>SO<sub>4</sub></td>
            </tr>
            <tr>
                <td>foszforsav</td>
                <td>H<sub>3</sub>PO<sub>4</sub></td>
            </tr>
            <tr>
                <td>víz</td>
                <td>H<sub>2</sub>O</td>
            </tr>
        </tbody>

    </table>
</body>
</html>
